[project]
name = "mrtamaki"
version = "1.12.3"
description = "CLI toolkit for proxy, IP, system, lookup, and file operations"
readme = { text = "mrtamaki CLI toolkit for macOS.", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "readchar>=4",
    "requests>=2",
    "httpx>=0.25",
    "pyperclip>=1.8",
    "psutil>=5",
    "PySocks>=1.7",
    "dnspython>=2",
]

[project.scripts]
mt = "mrtamaki.cli:app"
mrtamaki = "mrtamaki.cli:app"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
